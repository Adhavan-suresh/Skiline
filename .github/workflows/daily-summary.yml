name: Daily ad summary

# Telegram summary of yesterday's per-ad spend, leads, CPL, CTR and lead-quality
# trend. 02:30 UTC = 08:00 IST (GitHub may start it a few minutes late).
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: chennai
        run: npm ci

      - name: Send daily summary
        working-directory: chennai
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          AD_ACCOUNT_ID: ${{ secrets.AD_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/reporting/daily-summary.js
